# Deploy auth-better-worker to Cloudflare on push to main.
#
# Same mise SSOT pattern as joeblew999/ifc-lite — every command here is
# identical to what devs run locally:
#
#   mise run 1-install   (install bun deps in worker, web, e2e)
#   mise run 6-build     (vite build of web SPA)
#   mise run 10-deploy   (build + wrangler deploy --env production)
#
# Required repo secret (sync from fnox once with: mise run secrets:sync-github):
#   CLOUDFLARE_API_TOKEN  — must include 'Workers Scripts : Edit',
#                           'Workers Routes : Edit', 'D1 : Edit',
#                           'Workers KV : Edit', 'Account Settings : Read'.
#
# Optional (only if rotating BETTER_AUTH_SECRET via CI is desired — by
# default, secret rotation is laptop-only via `mise run secrets:rotate-better-auth`):
#   none — the deploy keeps the existing wrangler-stored secret intact.

name: Deploy (mise)

# KNOWN ISSUE: CI deploy currently returns 'Could not route' [code 7003]
# from Cloudflare on `wrangler deploy --env production` even though the
# same call shape works from a laptop with the same CLOUDFLARE_API_TOKEN
# + CLOUDFLARE_ACCOUNT_ID. Token permissions, worker name, account ID
# all verified by direct CF API call. Currently triggered manually via
# workflow_dispatch only — push trigger disabled until root-cause is
# found, to avoid red badges on every commit. Laptop deploy via
# `mise run 10-deploy` is the documented production path for now.

on:
  workflow_dispatch:

concurrency:
  group: deploy-mise-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy auth-better-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SSOT: mise installs bun, node, wrangler, pitchfork — same versions
      # as local. No setup-bun / setup-node / setup-wrangler steps.
      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Install deps (mise run 1-install)
        run: mise run 1-install

      # DIAGNOSTIC — direct CF API probes with the same token + account
      # that wrangler will use. Tells us EXACTLY which endpoint fails
      # and why, so we can isolate token-vs-wrangler-vs-network when
      # the deploy below errors with cryptic 7003.
      - name: Diagnose CF API access (mise run cf:diag)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise run cf:diag

      - name: Build + deploy (mise run 10-deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise run 10-deploy

      - name: Smoke (post-deploy verify)
        run: |
          echo "=== /health ==="
          curl -fsSL https://auth.ubuntusoftware.net/health | jq .
          echo "=== /auth/api/get-session (unauthenticated) ==="
          curl -fsSL https://auth.ubuntusoftware.net/auth/api/get-session
          echo
