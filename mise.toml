sleep 2
curl -isS -X POST "$AUTH_BETTER_PROD_URL/auth/api/sign-in/magic-link" \
  -H "Content-Type: application/json" \
  -H "Origin: $AUTH_BETTER_PROD_URL" \
  --data "{\\"email\\":\\"$EMAIL\\"}" | head -3
"""


# ── Users (admin tooling — direct D1 + Better Auth admin endpoints) ─────────
# These tasks talk to the deployed prod D1 + Worker. They need
# CLOUDFLARE_API_TOKEN with D1:Edit + Workers Scripts:Edit (already in our
# canonical token). All tasks read ENV (default 'production') so you can
# point them at staging/etc once that exists.

[tasks."users:list"]
description = "List most recent N users from prod D1. Override count: N=20 mise run users:list"
shell = "bash -c"
run = """
set -eu
ENV="${ENV:-production}"
N="${N:-10}"
export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$(mise exec -- fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"
cd worker
mise exec -- wrangler d1 execute auth-better-db --remote --env "$ENV" \
  --command "SELECT email, username, displayUsername, datetime(createdAt) AS created FROM user ORDER BY createdAt DESC LIMIT $N" 2>&1 \
  | grep -E '"email":|"username":|"displayUsername":|"created":' \
  | sed 's/^[[:space:]]*//; s/,$//' || true
"""

[tasks."users:find"]
description = "Find users by substring (matches email or username)"
shell = "bash -c"
run = """
set -eu
ENV="${ENV:-production}"
Q="{{arg(name='query', help='substring to match against email or username')}}"
export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$(mise exec -- fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"
cd worker
mise exec -- wrangler d1 execute auth-better-db --remote --env "$ENV" \
  --command "SELECT id, email, username, displayUsername, role, datetime(createdAt) AS created FROM user WHERE email LIKE '%${Q}%' OR username LIKE '%${Q}%' ORDER BY createdAt DESC LIMIT 20" 2>&1 \
  | grep -E '"id":|"email":|"username":|"displayUsername":|"role":|"created":' \
  | sed 's/^[[:space:]]*//; s/,$//' || true
"""

[tasks."users:show"]
description = "Show one user + their org memberships"
shell = "bash -c"
run = """
set -eu
ENV="${ENV:-production}"
EMAIL="{{arg(name='email', help='user email address')}}"
export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$(mise exec -- fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"
cd worker
echo "=== user ==="
mise exec -- wrangler d1 execute auth-better-db --remote --env "$ENV" \
  --command "SELECT id, email, username, displayUsername, role, banned, emailVerified, twoFactorEnabled, datetime(createdAt) AS created FROM user WHERE email = '${EMAIL}'" 2>&1 \
  | grep -E '"id":|"email":|"username":|"displayUsername":|"role":|"banned":|"emailVerified":|"twoFactorEnabled":|"created":' \
  | sed 's/^[[:space:]]*//; s/,$//'
echo
echo "=== org memberships ==="
mise exec -- wrangler d1 execute auth-better-db --remote --env "$ENV" \
  --command "SELECT m.role AS member_role, o.name AS org_name, o.slug AS org_slug FROM member m JOIN organization o ON m.organizationId = o.id JOIN user u ON m.userId = u.id WHERE u.email = '${EMAIL}'" 2>&1 \
  | grep -E '"member_role":|"org_name":|"org_slug":' \
  | sed 's/^[[:space:]]*//; s/,$//'
"""

[tasks."users:make-admin"]
description = "Promote a user to platform admin (sets user.role='admin' — separate from per-org roles)"
shell = "bash -c"
run = """
set -eu
ENV="${ENV:-production}"
EMAIL="{{arg(name='email', help='user email address to promote')}}"
export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$(mise exec -- fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"
cd worker
mise exec -- wrangler d1 execute auth-better-db --remote --env "$ENV" \
  --command "UPDATE user SET role='admin' WHERE email='${EMAIL}'"
echo "✓ ${EMAIL} promoted to admin. They can now use Better Auth's /admin/* API."
"""

[tasks."users:purge-test"]
description = "Delete all @test.ubuntusoftware.net users + their orphan orgs (from prove:sso-rbac CI runs). Cascades clean up account/session/member rows automatically."
shell = "bash -c"
run = """
set -eu
ENV="${ENV:-production}"
echo "⚠️  This deletes ALL @test.ubuntusoftware.net users AND any 'proveorg-*' orgs in env=$ENV."
echo "    Used to clean up after prove:sso-rbac CI smoke runs."
echo
read -r -p "Type 'purge' to continue: " CONFIRM
[ "$CONFIRM" = "purge" ] || { echo "Aborted."; exit 0; }
export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$(mise exec -- fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"
ENV="$ENV" mise run wrangler:generate >/dev/null
cd worker
mise exec -- wrangler d1 execute auth-better-db --remote --env "$ENV" --command "DELETE FROM organization WHERE slug LIKE 'proveorg-%';"
mise exec -- wrangler d1 execute auth-better-db --remote --env "$ENV" --command "DELETE FROM user WHERE email LIKE '%@test.ubuntusoftware.net';"
echo "✓ purged"
"""

[tasks."users:reset-password"]
description = "Set a fresh random password for a user (one-time, no email — requires platform admin)"
shell = "bash -c"
run = """
set -eu
ENV="${ENV:-production}"
EMAIL="{{arg(name='email', help='user email address')}}"
: "${AUTH_BETTER_PROD_URL:?Set AUTH_BETTER_PROD_URL}"
export CLOUDFLARE_API_TOKEN="${CLOUDFLARE_API_TOKEN:-$(mise exec -- fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"

# Look up the user id from D1.
cd worker
USER_ID=$(mise exec -- wrangler d1 execute auth-better-db --remote --env "$ENV" \
  --command "SELECT id FROM user WHERE email='${EMAIL}'" 2>&1 \
  | grep -oE '"id":[[:space:]]*"[^"]+' | head -1 | sed 's/.*"//')
[ -n "$USER_ID" ] || { echo "✗ no user with email=${EMAIL}"; exit 1; }
echo "→ user id: $USER_ID"

NEW_PW=$(openssl rand -base64 24)
echo "→ new password: $NEW_PW"

# Better Auth admin endpoint — needs the caller's session cookie + admin role.
# This task is meant to be run from a logged-in browser session by an admin.
# For server-side use without a session, use the Better Auth admin SDK or
# update the credential account row directly (more invasive).
#
# Quick path: open the URL below in your already-signed-in admin browser
# and run this fetch from DevTools console:
echo
echo "Open https://${AUTH_BETTER_PROD_URL#https://}/auth/api/admin/has-permission"
echo "in your signed-in admin browser, then in DevTools console run:"
echo
cat <<JS
fetch('/auth/api/admin/set-user-password', {
  method: 'POST', credentials: 'include',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ userId: '${USER_ID}', newPassword: '${NEW_PW}' })
}).then(r => r.json()).then(console.log)
JS
"""
