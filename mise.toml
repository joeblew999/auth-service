[tools]
pitchfork = "latest"
bun       = "latest"
node      = "latest"
wrangler  = "latest"
# fnox: secrets manager by jdx (same author as mise). Encrypts at rest with
# age, key cached in macOS Keychain. Configured globally so the same secrets
# are available across every project on this machine.
"github:jdx/fnox"      = "latest"
"aqua:FiloSottile/age" = "1"
# GitHub CLI: used by secrets:sync-github. Pinned here so mise stays SSOT.
"aqua:cli/cli"         = "2"

[env]
AUTH_BETTER_PORT     = "8792"
AUTH_BETTER_WEB_PORT = "5174"
# Custom domain set by worker/wrangler.toml [env.production] routes. The
# *.workers.dev URL still resolves but cookies set on .ubuntusoftware.net
# only span subdomains of a registered domain (workers.dev is on the
# public suffix list).
AUTH_BETTER_PROD_URL = "https://auth.ubuntusoftware.net"

# fnox: working copy of the age private key. Canonical copy is in macOS
# Keychain (service=fnox, account=age-key). To restore on a new machine:
#   security find-generic-password -s fnox -a age-key -w \
#     > ~/.config/fnox/age.key && chmod 600 ~/.config/fnox/age.key
FNOX_AGE_KEY_FILE = "~/.config/fnox/age.key"

# ── Dev workflow ──────────────────────────────────────────────────────────────
#
#  Phase 1 — Coding loop (hot-reload dev servers):
#    1-install → 2-start → 4c-wait-worker → 3-migrate → 4-test → 4b-test-worker → 5-stop
#
#  Phase 2 — Bundle check (production-like wrangler, built SPA):
#    6-build → 7-start-wrangler → 3-migrate → 8-test-wrangler → 9-stop-wrangler
#
#  Phase 3 — Deploy + verify (Cloudflare production):
#    10-deploy → 10b-migrate-prod → 11-test-prod
#
#  Shortcuts:
#    ci            — automates Phase 1 end-to-end
#    ci-wrangler   — automates Phase 2 end-to-end
#    ci-prod       — automates Phase 3 end-to-end
# ─────────────────────────────────────────────────────────────────────────────

# ── Theme ─────────────────────────────────────────────────────────────────────

[tasks.theme]
description = "Switch web UI theme — usage: mise run theme -- <name>  (neutral|blue|rose|violet|green|orange|...)"
run = "cd web && bun scripts/apply-theme.ts $@"

# ── Phase 1: Coding loop ──────────────────────────────────────────────────────

[tasks."1-install"]
description = "Phase 1 — Install npm deps (first time only)"
run = """
cd worker && bun install
cd ../web  && bun install
cd ../e2e  && bun install && bunx playwright install chromium
"""

[tasks."2-start"]
description = "Phase 1 — Start worker (:8792) + web (:5174) via pitchfork"
run = "pitchfork start --all"

[tasks."3-migrate"]
description = "Phase 1/2 — Create DB schema (idempotent, works for dev or wrangler)"
run = "curl -s -X POST http://localhost:$AUTH_BETTER_PORT/auth/migrate | jq"

[tasks."4-test"]
description = "Phase 1 — Run Playwright tests against dev servers (:5174)"
run = "cd e2e && WORKERS=1 bunx playwright test"

[tasks."4b-test-worker"]
description = "Phase 1 — Run worker unit tests (vitest-pool-workers, no dev server needed)"
run = "cd worker && bun run test"

[tasks."4c-wait-worker"]
description = "Phase 1/2 — Wait for worker health check (up to 30s)"
run = """
for i in $(seq 1 30); do
  curl -sf "http://127.0.0.1:${AUTH_BETTER_PORT}/health" > /dev/null 2>&1 && exit 0
  sleep 1
done
echo "Worker did not start on :${AUTH_BETTER_PORT}" && exit 1
"""

[tasks."5-stop"]
description = "Phase 1 — Stop all pitchfork daemons"
run = "pitchfork stop --all"

# ── Phase 2: Bundle check ─────────────────────────────────────────────────────

[tasks."6-build"]
description = "Phase 2 — Build web SPA into web/dist/ (required for wrangler asset serving)"
run = "cd web && bun run build"

[tasks."7-start-wrangler"]
description = "Phase 2 — Start wrangler (foreground) — serves API + built SPA on :8792"
run = "cd worker && wrangler dev"

[tasks."8-test-wrangler"]
description = "Phase 2 — Run Playwright tests against wrangler (:8792)"
run = "cd e2e && WEB_URL=http://127.0.0.1:$AUTH_BETTER_PORT WORKER_URL=http://127.0.0.1:$AUTH_BETTER_PORT WORKERS=1 bunx playwright test"

[tasks."9-stop-wrangler"]
description = "Phase 2 — Kill wrangler on :8792"
run = "lsof -ti:$AUTH_BETTER_PORT | xargs kill -9 2>/dev/null || true"

# ── Phase 3: Deploy + verify ──────────────────────────────────────────────────

[tasks."10-deploy"]
description = "Phase 3 — Build web SPA then deploy worker + assets to Cloudflare. Default env: production. Override: mise run 10-deploy -- --env staging"
run = """
set -euo pipefail
ROOT="$(pwd)"

ENV="production"
while [[ $# -gt 0 ]]; do
  case "$1" in
    --env) ENV="$2"; shift 2 ;;
    *) echo "unknown arg: $1" >&2; exit 2 ;;
  esac
done

# Regenerate worker/wrangler.toml from worker/wrangler.toml.template +
# config/${ENV}.env. Single source of truth for everything that varies
# per env (domain, worker name, D1/KV IDs).
mise run wrangler:generate -- --env "$ENV"

# Always force-populate CLOUDFLARE_API_TOKEN from fnox so deploys don't
# silently fall back to wrangler's stored OAuth token (which expires
# every 24h). With the API token set explicitly, wrangler bypasses
# OAuth entirely. fnox holds the canonical value.
if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
  if T=$(fnox get CLOUDFLARE_API_TOKEN 2>/dev/null) && [ -n "$T" ]; then
    export CLOUDFLARE_API_TOKEN="$T"
    echo "→ Using CLOUDFLARE_API_TOKEN from fnox"
  else
    echo "→ No CLOUDFLARE_API_TOKEN in fnox — falling back to wrangler OAuth"
  fi
fi

# Pull TURNSTILE_SITE_KEY from fnox at build time so the React UI knows
# to render the captcha widget. Public value, safe to bake into bundle.
# Skipped silently when absent (captcha not yet onboarded — sign-in still
# works because the worker also gates on TURNSTILE_SECRET_KEY being set).
if VITE_TURNSTILE_SITE_KEY=$(fnox get TURNSTILE_SITE_KEY 2>/dev/null); then
  export VITE_TURNSTILE_SITE_KEY
  echo "→ Building with VITE_TURNSTILE_SITE_KEY (captcha UI active)"
else
  echo "→ Building without VITE_TURNSTILE_SITE_KEY (captcha UI off — run cf:turnstile:create to enable)"
fi

(cd "${ROOT}/web" && bun run build)
cd "${ROOT}/worker" && wrangler deploy --env "$ENV"
"""

[tasks."10b-migrate-prod"]
description = "Phase 3 — Run DB migrations on Cloudflare production (idempotent)"
run = """
set -euo pipefail
: "${AUTH_BETTER_PROD_URL:?Set AUTH_BETTER_PROD_URL to the deployed worker URL}"
curl -s -X POST "${AUTH_BETTER_PROD_URL}/auth/migrate" | jq
"""

[tasks."11-test-prod"]
description = "Phase 3 — Run Playwright tests against deployed Cloudflare worker"
run = """
set -euo pipefail
: "${AUTH_BETTER_PROD_URL:?Set AUTH_BETTER_PROD_URL to the deployed worker URL}"
cd e2e && WEB_URL="${AUTH_BETTER_PROD_URL}" WORKER_URL="${AUTH_BETTER_PROD_URL}" WORKERS=4 AUTH_TEST_SINK_ENABLED=true bunx playwright test
"""

# ── Shortcut ──────────────────────────────────────────────────────────────────

[tasks.ci]
description = "Shortcut — Full Phase 1: stop → 1-install → 2-start → 4c-wait-worker → 3-migrate → 4-test → 4b-test-worker → 5-stop"
run = """
set -euo pipefail
pitchfork stop --all 2>/dev/null || true
trap 'mise run 5-stop' EXIT
mise run 1-install
mise run 2-start
mise run 4c-wait-worker
mise run 3-migrate
mise run 4-test
mise run 4b-test-worker
"""

[tasks."ci-wrangler"]
description = "Shortcut — Full Phase 2: 9-stop-wrangler → 6-build → wrangler bg → 4c-wait-worker → 3-migrate → 8-test-wrangler → 9-stop-wrangler"
run = """
set -euo pipefail
ROOT="$(pwd)"
mise run 9-stop-wrangler
trap 'mise run 9-stop-wrangler' EXIT
mise run 6-build
(cd "${ROOT}/worker" && wrangler dev) &
mise run 4c-wait-worker
mise run 3-migrate
mise run 8-test-wrangler
"""

[tasks."ci-prod"]
description = "Shortcut — Full Phase 3: 10-deploy → 10b-migrate-prod → 11-test-prod"
run = """
set -euo pipefail
: "${AUTH_BETTER_PROD_URL:?Set AUTH_BETTER_PROD_URL to the deployed worker URL}"
mise run 10-deploy
mise run 10b-migrate-prod
mise run 11-test-prod
"""

# ── Secrets (fnox → GitHub Actions) ──────────────────────────────────────────
# https://fnox.jdx.dev — fnox is the local SSOT, backed by macOS Keychain.
# Set values once globally with: fnox set <KEY> --global --provider age
# Same pattern as joeblew999/ifc-lite so secrets are shared across projects.

[tasks."secrets:list"]
description = "Show the canonical secret mapping (fnox key → GitHub secret name)"
run = """
echo "Defined in scripts/sync-github-secrets.sh MAPPING table:"
grep -E '^\\s+"[A-Z_]+\\s+[A-Z_]+"' scripts/sync-github-secrets.sh | sed 's/^/  /'
echo
echo "Uncomment optional rows in scripts/sync-github-secrets.sh as new"
echo "secrets are added to fnox (e.g. social provider keys)."
"""

[tasks."secrets:status"]
description = "Show fnox secrets vs GitHub repo secrets (read-only)"
run = """
echo "== fnox =="
fnox list 2>/dev/null || echo "  (no config — run: fnox init --global)"
echo
echo "== GitHub repo secrets (joeblew999/auth-service) =="
gh secret list --repo joeblew999/auth-service 2>/dev/null || echo "  (run: gh auth login)"
"""

[tasks."secrets:sync-github"]
description = "Push secrets from fnox → GitHub Actions repo secrets"
run = "bash scripts/sync-github-secrets.sh"

[tasks."secrets:sync-github-dry"]
description = "Dry-run of secrets:sync-github (show plan, change nothing)"
run = "bash scripts/sync-github-secrets.sh --dry-run"

[tasks."secrets:put-cf"]
description = "Push BETTER_AUTH_SECRET from fnox → Cloudflare Worker secret store. Default env: production. Override: -- --env staging"
run = """
set -euo pipefail
ENV="production"
while [[ $# -gt 0 ]]; do
  case "$1" in
    --env) ENV="$2"; shift 2 ;;
    *) echo "unknown arg: $1" >&2; exit 2 ;;
  esac
done
SECRET_VALUE=$(fnox get BETTER_AUTH_SECRET 2>/dev/null || true)
if [ -z "$SECRET_VALUE" ]; then
  echo "BETTER_AUTH_SECRET not in fnox — generate one:" >&2
  echo "  openssl rand -base64 32 | fnox set BETTER_AUTH_SECRET --global --provider age" >&2
  exit 1
fi
mise run wrangler:generate -- --env "$ENV"
cd worker
echo "$SECRET_VALUE" | wrangler secret put BETTER_AUTH_SECRET --env "$ENV"
"""

[tasks."secrets:rotate-better-auth"]
description = "Rotate BETTER_AUTH_SECRET (invalidates ALL active sessions). Default env: production. Override: -- --env staging"
run = """
set -euo pipefail
ENV="production"
while [[ $# -gt 0 ]]; do
  case "$1" in
    --env) ENV="$2"; shift 2 ;;
    *) echo "unknown arg: $1" >&2; exit 2 ;;
  esac
done
echo "⚠️  This will invalidate every active session in env=$ENV."
echo "    Every signed-in user will be forced to re-auth on next request."
echo
read -r -p "Type 'rotate' to continue: " CONFIRM
[ "$CONFIRM" = "rotate" ] || { echo "Aborted."; exit 0; }
NEW=$(openssl rand -base64 32)
printf '%s' "$NEW" | fnox set BETTER_AUTH_SECRET --global --provider age
echo "✓ Saved to fnox."
mise run wrangler:generate -- --env "$ENV"
cd worker
printf '%s' "$NEW" | wrangler secret put BETTER_AUTH_SECRET --env "$ENV"
echo "✓ Pushed to deployed Worker (env=$ENV). New sessions use the new secret."
"""

[tasks."secrets:cf:list"]
description = "List secrets currently set on the deployed Worker (values not shown — wrangler hides them)"
run = "cd worker && wrangler secret list --env production"

# ── Email Service onboarding ──────────────────────────────────────────────────
# Cloudflare's NEW Email Service (beta) requires onboarding a sending
# subdomain (mail.ubuntusoftware.net) before env.SEND_EMAIL.send() can
# deliver to arbitrary external recipients. Without this, the binding
# falls back to legacy Email Routing semantics and rejects unverified
# destinations with "destination address is not a verified address".
#
# These tasks wrap the CF API. They need a token with these scopes (in
# addition to what `wrangler login` gives you):
#   - Zone : Email Sending : Edit (the new CF Email Service scope —
#     'Email Routing' is the OLD scope name, no longer offered in 2026)
#
# Set the token in fnox once: `fnox set CLOUDFLARE_API_TOKEN --global --provider age`
# (you almost certainly already have it set — that's the same token CF
# Workers deploy uses).

[tasks."cf:provision"]
description = "Provision Cloudflare D1 + KV for a new env. Reads config/<env>.env (must already define DOMAIN, WORKER_NAME, D1_DATABASE_NAME, KV_NAMESPACE_NAME). Writes the new resource IDs back. Idempotent: skips creation if IDs already filled."
run = """
set -euo pipefail
ENV="${1:-production}"
[ "$ENV" != "--env" ] || ENV="${2:-production}"
CFG="config/${ENV}.env"
[ -f "$CFG" ] || { echo "✗ $CFG not found. Copy config/template.env first."; exit 1; }

set -a; source "$CFG"; set +a
echo "→ Provisioning CF resources for env=$ENV (DOMAIN=$DOMAIN, WORKER=$WORKER_NAME)"

# Force fnox token so wrangler doesn't fall back to expired OAuth.
if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
  T=$(fnox get CLOUDFLARE_API_TOKEN 2>/dev/null) || T=""
  [ -n "$T" ] && export CLOUDFLARE_API_TOKEN="$T"
fi

# Helper: replace KEY=VALUE in $CFG (or append if missing).
upsert() {
  local key="$1" val="$2" file="$CFG"
  if grep -qE "^${key}=" "$file"; then
    # POSIX-safe in-place edit (BSD + GNU sed compatible via tmpfile)
    awk -v k="$key" -v v="$val" 'BEGIN{set=0} {if (\\$0 ~ "^"k"=") {print k"="v; set=1} else print} END{if (!set) print k"="v}' "$file" > "${file}.tmp"
    mv "${file}.tmp" "$file"
  else
    echo "${key}=${val}" >> "$file"
  fi
}

# 1. D1 — create if D1_DATABASE_ID empty
if [ -z "${D1_DATABASE_ID:-}" ] || [ "$D1_DATABASE_ID" = "TBD" ]; then
  echo "→ Creating D1 database '$D1_DATABASE_NAME'..."
  RESULT=$(wrangler d1 create "$D1_DATABASE_NAME" 2>&1)
  echo "$RESULT"
  ID=$(echo "$RESULT" | grep -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
  [ -n "$ID" ] || { echo "✗ couldn't parse D1 id from output"; exit 1; }
  upsert D1_DATABASE_ID "$ID"
  echo "✓ D1_DATABASE_ID=$ID written to $CFG"
else
  echo "✓ D1_DATABASE_ID already set ($D1_DATABASE_ID), skipping create"
fi

# 2. KV — create if KV_NAMESPACE_ID empty
if [ -z "${KV_NAMESPACE_ID:-}" ] || [ "$KV_NAMESPACE_ID" = "TBD" ]; then
  echo "→ Creating KV namespace '$KV_NAMESPACE_NAME'..."
  RESULT=$(wrangler kv namespace create "$KV_NAMESPACE_NAME" 2>&1)
  echo "$RESULT"
  ID=$(echo "$RESULT" | grep -Eo '"[0-9a-f]{32}"' | tr -d '"' | head -1)
  [ -n "$ID" ] || { echo "✗ couldn't parse KV id from output"; exit 1; }
  upsert KV_NAMESPACE_ID "$ID"
  echo "✓ KV_NAMESPACE_ID=$ID written to $CFG"
else
  echo "✓ KV_NAMESPACE_ID already set ($KV_NAMESPACE_ID), skipping create"
fi

# 3. Regenerate wrangler.toml with the new IDs.
mise run wrangler:generate -- --env "$ENV"

echo
echo "✓ Provisioning done for env=$ENV. Next:"
echo "    mise run cf:token:create   # if you don't already have CLOUDFLARE_API_TOKEN with the right scopes"
echo "    mise run email:onboard -- --env $ENV   # provision the sending subdomain"
echo "    mise run secrets:gen-better-auth   # mint and push BETTER_AUTH_SECRET"
echo "    mise run 10-deploy -- --env $ENV"
"""

[tasks."env:list"]
description = "List every env config (each config/<name>.env file)"
run = """
echo "Active env: ${MISE_ENV_NAME:-production} (override with: mise run env:use -- <name>)"
echo
echo "Available envs:"
for f in config/*.env; do
  name=$(basename "$f" .env)
  if [ "$name" = "template" ]; then continue; fi
  domain=$(grep -E '^DOMAIN=' "$f" | cut -d= -f2)
  echo "  $name → $domain"
done
"""

[tasks."env:use"]
description = "Set the default env for subsequent mise runs (writes to .mise.local.toml). Usage: mise run env:use -- staging"
run = """
set -euo pipefail
NAME="${1:?usage: mise run env:use -- <env-name>}"
[ -f "config/${NAME}.env" ] || { echo "✗ config/${NAME}.env not found. Copy config/template.env first." >&2; exit 1; }
cat > .mise.local.toml <<EOF
# Generated by `mise run env:use -- ${NAME}`. Gitignored.
# Sets the default env for tasks that accept --env.
[env]
MISE_ENV_NAME = "${NAME}"
EOF
echo "✓ Default env set to '${NAME}' (.mise.local.toml). Override per-call with: -- --env <other>"
"""

[tasks."wrangler:generate"]
description = "Render worker/wrangler.toml from worker/wrangler.toml.template + config/<env>.env (default env: production). Override with: mise run wrangler:generate -- --env staging"
run = """
set -euo pipefail
ENV="production"
while [[ $# -gt 0 ]]; do
  case "$1" in
    --env) ENV="$2"; shift 2 ;;
    *) echo "unknown arg: $1" >&2; exit 2 ;;
  esac
done
CFG="config/${ENV}.env"
[ -f "$CFG" ] || { echo "✗ $CFG not found. Copy config/template.env to start a new env." >&2; exit 1; }

# Source config into env (strict: all referenced vars must be defined).
set -a
source "$CFG"
set +a

# Validate every placeholder is set; envsubst silently substitutes empty string otherwise.
required=(DOMAIN WORKER_NAME SUBDOMAIN_AUTH SUBDOMAIN_MAIL SUBDOMAIN_TEST EMAIL_FROM_LOCAL EMAIL_FROM_NAME D1_DATABASE_NAME D1_DATABASE_ID KV_NAMESPACE_NAME KV_NAMESPACE_ID)
missing=0
for var in "${required[@]}"; do
  if [ -z "${!var:-}" ]; then
    echo "✗ $CFG: $var is empty" >&2
    missing=$((missing+1))
  fi
done
[ "$missing" -eq 0 ] || { echo "Fix the missing values above and re-run." >&2; exit 1; }

OUT="worker/wrangler.toml"
envsubst < worker/wrangler.toml.template > "$OUT"
echo "✓ Generated $OUT for env=$ENV"
"""

[tasks."consumer:scaffold"]
description = "Print copy-paste-ready boilerplate for a NEW Cloudflare Worker that wants to consume this auth-service via Service Bindings. Default env: production. Override: -- --env staging"
run = """
set -euo pipefail
ENV="production"
while [[ $# -gt 0 ]]; do
  case "$1" in
    --env) ENV="$2"; shift 2 ;;
    *) echo "unknown arg: $1" >&2; exit 2 ;;
  esac
done
CFG="config/${ENV}.env"
[ -f "$CFG" ] || { echo "✗ $CFG not found"; exit 1; }
set -a; source "$CFG"; set +a

cat <<EOF

════════════════════════════════════════════════════════════════════
  Wire any Worker on *.${DOMAIN} as a consumer of ${WORKER_NAME}
════════════════════════════════════════════════════════════════════

Step 1: Add to your consumer Worker's wrangler.jsonc (or wrangler.toml)
─────────────────────────────────────────────────────────────────────

{
  "name": "your-app",
  "main": "src/index.ts",
  "compatibility_date": "2025-10-08",
  "services": [
    { "binding": "AUTH", "service": "${WORKER_NAME}" }
  ],
  "routes": [
    { "pattern": "your-app.${DOMAIN}", "custom_domain": true }
  ]
}

  • Both Workers must be in the same Cloudflare account.
  • The custom domain MUST be on .${DOMAIN} for the session cookie
    (set on .${DOMAIN}) to be sent by the browser.

Step 2: Drop this helper into your Worker (5 lines)
─────────────────────────────────────────────────────────────────────

interface Env { AUTH: Fetcher; /* + your other bindings */ }

async function getAuthUser(req: Request, env: Env) {
  const r = await env.AUTH.fetch(new Request('https://auth/auth/api/get-session', {
    headers: { cookie: req.headers.get('cookie') ?? '' }
  }));
  return r.ok ? (await r.json() as { user?: unknown } | null)?.user ?? null : null;
}

Step 3: Use it in any route
─────────────────────────────────────────────────────────────────────

export default {
  async fetch(req: Request, env: Env) {
    const user = await getAuthUser(req, env);
    if (!user) {
      return Response.redirect(
        'https://${SUBDOMAIN_AUTH}.${DOMAIN}/auth/sign-in?next=' + encodeURIComponent(req.url),
        302
      );
    }
    return Response.json({ greeting: 'hi ' + user.email });
  },
};

That's it. 'wrangler deploy' your consumer + the binding works
immediately — no extra setup on the auth-service side.

Reference implementation:
  https://github.com/joeblew999/ifc-lite/blob/cloudflare/deploy/apps/viewer/worker/index.ts
EOF
"""

[tasks."setup:bootstrap"]
description = "One command to take a fresh fork from zero to deployed. Walks every prerequisite, calls every other setup task in the right order, asks before each step that costs money or invalidates sessions."
run = """
set -euo pipefail
ENV="${1:-production}"
[ "$ENV" != "--env" ] || ENV="${2:-production}"

echo "════════════════════════════════════════════════════════════════════"
echo "  setup:bootstrap — fresh fork → live deploy for env=$ENV"
echo "════════════════════════════════════════════════════════════════════"
echo
echo "Prerequisites (you do these once, ever, on this machine):"
echo "  • install + activate mise"
echo "  • mise install"
echo "  • wrangler login + gh auth login"
echo
echo "This task will (in order):"
echo "  1. fnox:init                         (skipped if you already have an age key)"
echo "  2. cf:token:create                   (skipped if CLOUDFLARE_API_TOKEN already in fnox)"
echo "  3. cf:provision -- --env $ENV        (skipped if D1/KV IDs already in config/$ENV.env)"
echo "  4. cf:turnstile:create               (skipped if TURNSTILE_*_KEY already in fnox)"
echo "  5. email:onboard -- --env $ENV       (creates mail subdomain, idempotent)"
echo "  6. secrets:gen-better-auth           (only if BETTER_AUTH_SECRET not in fnox)"
echo "  7. 10-deploy -- --env $ENV"
echo "  8. setup:check -- --env $ENV"
echo
read -r -p "Continue? [y/N] " CONFIRM
[ "$CONFIRM" = "y" ] || [ "$CONFIRM" = "Y" ] || { echo "Aborted."; exit 0; }

KEY_PATH="${FNOX_AGE_KEY_FILE:-~/.config/fnox/age.key}"
KEY_PATH="${KEY_PATH/#\\~/$HOME}"
[ -f "$KEY_PATH" ] || mise run fnox:init
fnox get CLOUDFLARE_API_TOKEN >/dev/null 2>&1 || mise run cf:token:create
mise run cf:provision -- --env "$ENV"
fnox get TURNSTILE_SITE_KEY >/dev/null 2>&1 || mise run cf:turnstile:create
mise run email:onboard -- --env "$ENV"
fnox get BETTER_AUTH_SECRET >/dev/null 2>&1 || mise run secrets:gen-better-auth
mise run 10-deploy -- --env "$ENV"
mise run setup:check -- --env "$ENV"

CFG="config/${ENV}.env"; set -a; source "$CFG"; set +a
echo
echo "════════════════════════════════════════════════════════════════════"
echo "  ✓ Done. Your auth service is live at:"
echo "       https://${SUBDOMAIN_AUTH}.${DOMAIN}"
echo "  Test it: open the URL, sign up, then verify with:"
echo "       mise run email:test -- --env $ENV"
echo "════════════════════════════════════════════════════════════════════"
"""

[tasks."setup:check"]
description = "Diagnose dev/deploy prerequisites — tells you what's missing and what to run next. Default env: production. Override: -- --env staging"
run = """
set -euo pipefail
ENV="production"
while [[ $# -gt 0 ]]; do
  case "$1" in
    --env) ENV="$2"; shift 2 ;;
    *) echo "unknown arg: $1" >&2; exit 2 ;;
  esac
done
echo "Checking env=$ENV"
echo
ok=0; warn=0; bad=0
say_ok()   { printf '  ✓ %s\\n' "$1"; ok=$((ok+1)); }
say_warn() { printf '  ⚠  %s\\n' "$1"; warn=$((warn+1)); }
say_bad()  { printf '  ✗ %s — fix: %s\\n' "$1" "$2"; bad=$((bad+1)); }

echo "== Toolchain (provisioned by mise) =="
for tool in bun node wrangler fnox age gh pitchfork; do
  if command -v $tool >/dev/null 2>&1; then
    say_ok "$tool"
  else
    say_bad "$tool not on PATH" "mise install"
  fi
done

echo
echo "== fnox =="
KEY_PATH="${FNOX_AGE_KEY_FILE:-~/.config/fnox/age.key}"
KEY_PATH="${KEY_PATH/#\\~/$HOME}"
if [ -f "$KEY_PATH" ]; then
  say_ok "age key file exists ($KEY_PATH)"
else
  say_bad "age key file missing ($KEY_PATH)" "mise run fnox:init"
fi
if fnox list >/dev/null 2>&1; then
  N=$(fnox list 2>/dev/null | tail -n +2 | wc -l | tr -d ' ')
  say_ok "fnox config readable ($N secrets)"
else
  say_bad "fnox can't read config" "mise run fnox:init"
fi

echo
echo "== Required secrets in fnox =="
for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
  if fnox get "$k" >/dev/null 2>&1; then say_ok "$k"; else say_bad "$k missing" "mise run cf:token:create"; fi
done

echo
echo "== Optional secrets in fnox =="
for k in BETTER_AUTH_SECRET TURNSTILE_SITE_KEY TURNSTILE_SECRET_KEY; do
  if fnox get "$k" >/dev/null 2>&1; then say_ok "$k"; else say_warn "$k missing (only required for prod deploy)"; fi
done

echo
echo "== Auth (browser-OAuth tools) =="
if gh auth status >/dev/null 2>&1; then say_ok "gh authed"; else say_warn "gh not authed (run: gh auth login)"; fi

echo
echo "== Config + reachability for env=$ENV =="
CFG="config/${ENV}.env"
if [ -f "$CFG" ]; then
  say_ok "$CFG exists"
  set -a; source "$CFG"; set +a
  AUTH_HOST="${SUBDOMAIN_AUTH}.${DOMAIN}"
  if curl -fsS -o /dev/null -w '' "https://$AUTH_HOST/health" 2>/dev/null; then
    say_ok "https://$AUTH_HOST/health 200"
  else
    say_warn "https://$AUTH_HOST/health unreachable (only matters if you deployed)"
  fi
else
  say_bad "$CFG missing" "cp config/template.env $CFG and fill in"
fi

echo
echo "Result: ok=$ok warn=$warn bad=$bad"
[ "$bad" -eq 0 ] || exit 1
"""

[tasks."fnox:init"]
description = "Bootstrap fnox for a fresh dev — generates an age keypair, saves to macOS Keychain + ~/.config/fnox/age.key, writes config.toml"
run = """
set -euo pipefail
KEY_FILE="${FNOX_AGE_KEY_FILE:-$HOME/.config/fnox/age.key}"
CONFIG="$HOME/.config/fnox/config.toml"
mkdir -p "$(dirname "$KEY_FILE")"

if [ -f "$KEY_FILE" ]; then
  echo "✓ age key file already exists at $KEY_FILE — nothing to do."
  echo "  (To start over, delete it and re-run.)"
  exit 0
fi

echo "→ Generating fresh age keypair..."
age-keygen -o "$KEY_FILE" 2>&1
chmod 600 "$KEY_FILE"
RECIPIENT=$(age-keygen -y "$KEY_FILE")
echo "✓ Public key (recipient): $RECIPIENT"

if command -v security >/dev/null 2>&1; then
  echo "→ Caching private key in macOS Keychain (service=fnox, account=age-key)..."
  security add-generic-password -s fnox -a age-key -w "$(cat "$KEY_FILE")" -U 2>&1 || true
  echo "✓ To restore on a new machine:"
  echo "    security find-generic-password -s fnox -a age-key -w > $KEY_FILE && chmod 600 $KEY_FILE"
fi

if [ ! -f "$CONFIG" ]; then
  cat > "$CONFIG" <<EOF
# Global fnox config — sourced by every mise project that uses fnox.
# Encryption: age. Public key is here (safe to commit/share). Private
# key is at FNOX_AGE_KEY_FILE (set per-project in .mise.toml [env]).
[providers.age]
type = "age"
recipients = ["$RECIPIENT"]

[secrets]
EOF
  echo "✓ Wrote $CONFIG with your recipient."
else
  echo "⚠  $CONFIG already exists — leaving alone. Make sure recipients includes:"
  echo "    $RECIPIENT"
fi

echo
echo "Next: mise run cf:token:create   # bootstrap your CLOUDFLARE_API_TOKEN"
"""

[tasks."secrets:gen-better-auth"]
description = "Generate a fresh BETTER_AUTH_SECRET (32-byte random), save to fnox + push to deployed Worker"
run = """
set -euo pipefail
SECRET=$(openssl rand -base64 32)
printf '%s' "$SECRET" | fnox set BETTER_AUTH_SECRET --global --provider age
echo "✓ Saved BETTER_AUTH_SECRET to fnox."
echo "→ Pushing to deployed Worker (production)..."
cd worker
printf '%s' "$SECRET" | wrangler secret put BETTER_AUTH_SECRET --env production
echo "✓ Done."
"""

[tasks."cf:token:check"]
description = "Verify the current CLOUDFLARE_API_TOKEN has the scopes needed for everything in this repo"
run = """
set -euo pipefail
: "${CLOUDFLARE_API_TOKEN:=$(fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"
[ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "✗ CLOUDFLARE_API_TOKEN not set (and not in fnox)"; exit 1; }

CF="https://api.cloudflare.com/client/v4"
AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

echo "== Token identity =="
TOKEN_INFO=$(curl -sS -H "$AUTH" "$CF/user/tokens/verify")
echo "$TOKEN_INFO" | jq '.result // .errors'

ZONE_ID=$(curl -fsS -H "$AUTH" "$CF/zones?name=ubuntusoftware.net" | jq -r '.result[0].id')
echo
echo "== Scope probe =="
printf 'Zone read (zones list)................. '
[ "$ZONE_ID" != "null" ] && echo "✓" || echo "✗"
printf 'Workers Scripts edit (deploy:web)...... '
curl -fsS -H "$AUTH" "$CF/accounts/$(wrangler whoami 2>&1 | grep -oE '[0-9a-f]{32}' | head -1)/workers/scripts" >/dev/null 2>&1 && echo "✓" || echo "✗"
printf 'Email Sending edit (email:onboard)..... '
RESP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "$AUTH" "$CF/zones/$ZONE_ID/email/sending/subdomains")
[ "$RESP_CODE" = "200" ] && echo "✓" || echo "✗ (HTTP $RESP_CODE — run: mise run cf:token:create)"
"""

[tasks."cf:token:create"]
description = "Guide creating a fresh CLOUDFLARE_API_TOKEN with all scopes this repo needs, save to fnox"
run = """
set -euo pipefail
cat <<'EOF'

────────────────────────────────────────────────────────────────────
  Cloudflare API Token — for joeblew999/auth-service
────────────────────────────────────────────────────────────────────

We need a token with these scopes (so mise tasks can run end-to-end
without you clicking in the dashboard each time):

  Account permissions:
    • Workers Scripts            : Edit       (deploy worker)
    • Workers KV Storage         : Edit       (session cache)
    • Workers R2 Storage         : Edit       (only if you add R2 later)
    • D1                         : Edit       (auth-better-db migrations)
    • Email Routing Addresses    : Edit       (verified-destinations list)
    • Email Sending              : Edit       (the critical one — new CF Email Service)
    • Account Settings           : Read

  Zone permissions:
    • Zone                       : Read       (resolve ubuntusoftware.net)
    • Workers Routes             : Edit       (custom domains)
    • DNS                        : Edit       (auto-provision SPF / DKIM / DMARC)
    • DNS                        : Edit       (auto-provision SPF/DKIM)

  Zone resources:
    • Include : Specific zone : ubuntusoftware.net

────────────────────────────────────────────────────────────────────
EOF

URL="https://dash.cloudflare.com/profile/api-tokens"
echo "Opening $URL ..."
echo "  → click 'Create Token' → 'Create Custom Token' → fill in the scopes above"
( command -v open >/dev/null && open "$URL" ) || true

echo
read -r -p "Paste the token here (input hidden): " -s NEW_TOKEN
echo

[ -n "$NEW_TOKEN" ] || { echo "✗ empty token, aborting"; exit 1; }

# Verify before saving — fail fast on a bad paste.
VERIFY=$(curl -sS -H "Authorization: Bearer $NEW_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify" | jq -r '.success')
[ "$VERIFY" = "true" ] || { echo "✗ token verification failed — not saving"; exit 1; }

echo "✓ Token verified. Saving to fnox..."
printf '%s' "$NEW_TOKEN" | fnox set CLOUDFLARE_API_TOKEN --global --provider age
echo "✓ Saved. Run 'mise run cf:token:check' to confirm scopes."
"""

[tasks."cf:turnstile:create"]
description = "Guide creating a Cloudflare Turnstile widget, save sitekey + secret to fnox, push secret to wrangler"
run = """
set -euo pipefail
cat <<'EOF'

────────────────────────────────────────────────────────────────────
  Cloudflare Turnstile widget — for joeblew999/auth-service
────────────────────────────────────────────────────────────────────

Turnstile is CF's free, unlimited bot-protection widget. We use it to
gate sign-in / sign-up / forget-password endpoints.

Steps in the dashboard (~2 min):

  1. Visit: https://dash.cloudflare.com/?to=/:account/turnstile
  2. Click 'Add widget' (or 'Add Site')
  3. Settings:
       Widget name : auth.ubuntusoftware.net
       Hostnames   : ubuntusoftware.net  (includes all subdomains)
                     localhost
                     127.0.0.1
       Widget mode : Managed (recommended — CF picks the challenge)
  4. Click Create.
  5. Copy the SITE KEY (starts with 0x...) and SECRET KEY
     (starts with 0x... too — DIFFERENT value).

────────────────────────────────────────────────────────────────────
EOF

URL="https://dash.cloudflare.com/?to=/:account/turnstile"
( command -v open >/dev/null && open "$URL" ) || true

read -r -p "Paste SITE key (0x...): " SITEKEY
[ -n "$SITEKEY" ] || { echo "✗ empty sitekey, aborting"; exit 1; }
read -r -p "Paste SECRET key (0x...) (input hidden): " -s SECRETKEY
echo
[ -n "$SECRETKEY" ] || { echo "✗ empty secret, aborting"; exit 1; }

echo "→ Saving SITE key to fnox (TURNSTILE_SITE_KEY, public — safe to bake into web build)..."
printf '%s' "$SITEKEY" | fnox set TURNSTILE_SITE_KEY --global --provider age

echo "→ Saving SECRET key to fnox (TURNSTILE_SECRET_KEY, server-only)..."
printf '%s' "$SECRETKEY" | fnox set TURNSTILE_SECRET_KEY --global --provider age

echo "→ Pushing SECRET key to deployed Worker..."
cd worker
printf '%s' "$SECRETKEY" | wrangler secret put TURNSTILE_SECRET_KEY --env production
cd ..

echo
echo "✓ Done. Site key (public, used by web build): $SITEKEY"
echo
echo "Next: enable the captcha plugin in worker/src/plugins.ts (server),"
echo "wire it into <AuthUIProvider captcha={...}> in web/ (client),"
echo "rebuild + redeploy."
"""

[tasks."email:onboard"]
description = "Provision ${SUBDOMAIN_MAIL}.${DOMAIN} as the sending subdomain so CF Email Service accepts arbitrary recipients. Default env: production. Override: -- --env staging"
run = """
set -euo pipefail
ENV="production"
while [[ $# -gt 0 ]]; do
  case "$1" in
    --env) ENV="$2"; shift 2 ;;
    *) echo "unknown arg: $1" >&2; exit 2 ;;
  esac
done
CFG="config/${ENV}.env"; set -a; source "$CFG"; set +a
ZONE_NAME="$DOMAIN"
SUBDOMAIN="${SUBDOMAIN_MAIL}.${DOMAIN}"
echo "→ Using env=$ENV: zone=$ZONE_NAME subdomain=$SUBDOMAIN"
: "${CLOUDFLARE_API_TOKEN:=$(fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"
[ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "CLOUDFLARE_API_TOKEN not set (and not in fnox)"; exit 1; }

CF="https://api.cloudflare.com/client/v4"
AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

echo "→ Resolving zone $ZONE_NAME..."
ZONE_ID=$(curl -fsS -H "$AUTH" "$CF/zones?name=$ZONE_NAME" | jq -r '.result[0].id')
[ "$ZONE_ID" != "null" ] || { echo "Zone not found: $ZONE_NAME"; exit 1; }
echo "  zone id: $ZONE_ID"

echo "→ Existing sending subdomains:"
EXISTING=$(curl -sS -w "\\n%{http_code}" -H "$AUTH" "$CF/zones/$ZONE_ID/email/sending/subdomains")
EXISTING_CODE=$(echo "$EXISTING" | tail -1)
EXISTING_BODY=$(echo "$EXISTING" | sed '$d')
if [ "$EXISTING_CODE" = "403" ] || [ "$EXISTING_CODE" = "401" ]; then
  echo "✗ HTTP $EXISTING_CODE from CF API." >&2
  echo "  Your CLOUDFLARE_API_TOKEN is missing 'Zone : Email Sending : Edit' scope." >&2
  echo
  echo "  Two ways to fix:" >&2
  echo "    a) https://dash.cloudflare.com/profile/api-tokens → edit your token →" >&2
  echo "       add 'Zone : Email Sending : Edit' for $ZONE_NAME → save → fnox set CLOUDFLARE_API_TOKEN" >&2
  echo "    b) https://dash.cloudflare.com/?to=/:account/email/sending → Add domain →" >&2
  echo "       enter '$SUBDOMAIN' (one click since the zone is already on CF)" >&2
  echo
  echo "  Either path: code is already correct, deploy is already live, magic-link works after onboarding." >&2
  exit 1
fi
echo "$EXISTING_BODY" | jq '.result // .errors'

echo "→ Creating sending subdomain $SUBDOMAIN (idempotent)..."
RESP=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" \
  --data "{\\"name\\":\\"$SUBDOMAIN\\"}" \
  "$CF/zones/$ZONE_ID/email/sending/subdomains")
echo "$RESP" | jq

if echo "$RESP" | jq -e '.success == true' >/dev/null; then
  echo
  echo "✓ Onboarded. Update worker/wrangler.toml [env.production.vars]:"
  echo "  AUTH_EMAIL_FROM = \\"noreply@$SUBDOMAIN\\""
  echo "  Then: mise run 10-deploy && mise run email:test"
elif echo "$RESP" | jq -e '.errors[0].code == 10000' >/dev/null; then
  echo
  echo "✗ Token missing 'Zone : Email Sending : Edit' scope. Either:" >&2
  echo "    a) Regenerate CLOUDFLARE_API_TOKEN with 'Zone : Email Sending : Edit' scope, then fnox set" >&2
  echo "    b) Onboard manually in CF dashboard → Email Service → Email Sending → Add domain" >&2
  exit 1
fi
"""

[tasks."email:status"]
description = "Show sending subdomain status + DNS records CF set up. Default env: production. Override: -- --env staging"
run = """
set -euo pipefail
ENV="production"
while [[ $# -gt 0 ]]; do
  case "$1" in
    --env) ENV="$2"; shift 2 ;;
    *) echo "unknown arg: $1" >&2; exit 2 ;;
  esac
done
CFG="config/${ENV}.env"; set -a; source "$CFG"; set +a
ZONE_NAME="$DOMAIN"
: "${CLOUDFLARE_API_TOKEN:=$(fnox get CLOUDFLARE_API_TOKEN 2>/dev/null || true)}"
CF="https://api.cloudflare.com/client/v4"
AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
ZONE_ID=$(curl -fsS -H "$AUTH" "$CF/zones?name=$ZONE_NAME" | jq -r '.result[0].id')
echo "== Sending subdomains =="
curl -fsS -H "$AUTH" "$CF/zones/$ZONE_ID/email/sending/subdomains" | jq '.result, .errors'
echo
echo "== Sending limits =="
curl -fsS -H "$AUTH" "$CF/accounts/$(wrangler whoami 2>&1 | grep -oE '[0-9a-f]{32}' | head -1)/email/sending/limits" | jq '.result, .errors'
"""

[tasks."email:test"]
description = "Trigger a magic link to a fresh test address and tail the worker logs"
run = """
set -euo pipefail
: "${AUTH_BETTER_PROD_URL:?Set AUTH_BETTER_PROD_URL}"
EMAIL="emailtest-$(date +%s)@test.ubuntusoftware.net"
echo "→ Triggering magic link to: $EMAIL"
echo "  Tail logs in another terminal:  cd worker && wrangler tail --env production"
sleep 2
curl -isS -X POST "$AUTH_BETTER_PROD_URL/auth/api/sign-in/magic-link" \
  -H "Content-Type: application/json" \
  -H "Origin: $AUTH_BETTER_PROD_URL" \
  --data "{\\"email\\":\\"$EMAIL\\"}" | head -3
"""
